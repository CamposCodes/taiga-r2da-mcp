# The actions of the CI are pinned by commit, so something has to say when a newer one exists.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  # The two packages the server runs on have exact versions in package.json: a newer one arrives as a proposal.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    ignore:
      # The types follow the lowest Node.js the package allows, which is 20: a newer line would offer what it lacks.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
