name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux, macOS and Windows differ in what the tests check: the mode of the temp folder, the folder of
        # the user profile, links.
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24, 26]
    steps:
      # Pinned by commit: a tag can be moved, a commit cannot. Dependabot proposes the updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # The scenarios start the built server against a fake Taiga on 127.0.0.1: no secret and no network are
      # needed. The coverage script runs them and then says how much of the server they ran.
      - run: npm run coverage
