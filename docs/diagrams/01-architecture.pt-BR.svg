<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 432" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d-01-architecture-pt-title d-01-architecture-pt-desc" id="d-01-architecture-pt-root">
        <title id="d-01-architecture-pt-title">Arquitetura do taiga-mcp</title>
        <desc id="d-01-architecture-pt-desc">Diagrama de arquitetura: o usuário pergunta ao cliente MCP, que fala com o servidor taiga-mcp por stdio na mesma máquina; o servidor chama a API REST do Taiga por HTTPS com o token e o servidor de arquivos de anexo por HTTPS sem o token, lê arquivos locais só pela tool taiga_attachments_add e grava binários numa pasta temporária.</desc>
        <defs>
      <style>#d-01-architecture-pt-root { --color-paper:   #e6f6f4;
      --color-ink:     #212121;
      --color-muted:   #414147;
      --color-accent:  #006557;
      --font-sans:     sans-serif;
      --font-serif:    serif;
      --font-mono:     monospace; }
      #d-01-architecture-pt-root { font-family: var(--font-sans); color: var(--color-ink); }
      #d-01-architecture-pt-root .diagram-container { width: 100%; overflow-x: auto; }
      #d-01-architecture-pt-root .diagram-container { overflow-x: visible; }</style>
          <marker id="d-01-architecture-pt-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#414147"/></marker>
          <marker id="d-01-architecture-pt-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#b85c33"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#e6f6f4"/>

        <!-- Zones (behind arrows and nodes) -->
        <rect x="184" y="40" width="440" height="312" rx="8" fill="#f5f5f5" stroke="#d3d3d3" stroke-width="1"/>
        <rect x="728" y="40" width="192" height="312" rx="8" fill="#f5f5f5" stroke="#d3d3d3" stroke-width="1"/>
        <g font-family="monospace" font-size="8" fill="#555555" letter-spacing="0.14em">
          <text x="200" y="57">MÁQUINA DO USUÁRIO</text>
          <text x="744" y="57">INSTALAÇÃO DO TAIGA</text>
        </g>

        <!-- Arrows first (behind boxes). Every one is a straight horizontal run. -->
        <!-- User to MCP client -->
        <line x1="136" y1="104" x2="200" y2="104" stroke="#414147" stroke-width="1.2" marker-end="url(#d-01-architecture-pt-arrow)"/>
        <!-- MCP client and server, both directions -->
        <line x1="360" y1="104" x2="464" y2="104" stroke="#414147" stroke-width="1.2" marker-start="url(#d-01-architecture-pt-arrow)" marker-end="url(#d-01-architecture-pt-arrow)"/>
        <!-- Local files to server: dashed, one tool only -->
        <line x1="360" y1="200" x2="464" y2="200" stroke="#414147" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#d-01-architecture-pt-arrow)"/>
        <!-- Server to temp folder -->
        <line x1="464" y1="296" x2="360" y2="296" stroke="#414147" stroke-width="1.2" marker-end="url(#d-01-architecture-pt-arrow)"/>
        <!-- Server to Taiga REST API -->
        <line x1="608" y1="104" x2="744" y2="104" stroke="#b85c33" stroke-width="1.2" marker-end="url(#d-01-architecture-pt-arrow-link)"/>
        <!-- Server to attachment file server -->
        <line x1="608" y1="296" x2="744" y2="296" stroke="#b85c33" stroke-width="1.2" marker-end="url(#d-01-architecture-pt-arrow-link)"/>

        <!-- Arrow labels: mask ends 8px above its line -->
        <rect x="144" y="84" width="32" height="12" rx="2" fill="#e6f6f4"/>
        <rect x="368" y="84" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <rect x="392" y="180" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <rect x="368" y="276" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <rect x="636" y="84" width="80" height="12" rx="2" fill="#e6f6f4"/>
        <rect x="632" y="276" width="88" height="12" rx="2" fill="#e6f6f4"/>
        <g font-family="monospace" font-size="8" fill="#414147" text-anchor="middle" letter-spacing="0.06em">
          <text x="160" y="93">PERGUNTA</text>
          <text x="412" y="93">STDIO JSON-RPC</text>
          <text x="412" y="189">LÊ</text>
          <text x="412" y="285">GRAVA BINÁRIOS</text>
          <text x="676" y="93">HTTPS + TOKEN</text>
          <text x="676" y="285">HTTPS SEM TOKEN</text>
        </g>

        <!-- Nodes -->
        <g font-family="sans-serif" font-size="12" font-weight="500" fill="#212121" text-anchor="middle">
          <!-- User -->
          <rect x="40" y="72" width="96" height="64" rx="6" fill="#ffffff" stroke="#212121" stroke-width="1"/>
          <text x="88" y="102">Usuário</text>
          <text x="88" y="118" font-family="monospace" font-size="9" font-weight="400" fill="#555555">linguagem comum</text>

          <!-- MCP client -->
          <rect x="200" y="72" width="160" height="64" rx="6" fill="#ffffff" stroke="#212121" stroke-width="1"/>
          <text x="280" y="93">Cliente MCP</text>
          <text x="280" y="109" font-family="monospace" font-size="9" font-weight="400" fill="#555555">Claude Code,</text>
          <text x="280" y="122" font-family="monospace" font-size="9" font-weight="400" fill="#555555">Claude Desktop ou Codex</text>

          <!-- Local files (store) -->
          <rect x="200" y="168" width="160" height="64" rx="6" fill="#ffffff" stroke="#d3d3d3" stroke-width="1"/>
          <text x="280" y="189">Arquivos locais</text>
          <text x="280" y="205" font-family="monospace" font-size="9" font-weight="400" fill="#555555">lidos só por</text>
          <text x="280" y="218" font-family="monospace" font-size="9" font-weight="400" fill="#555555">taiga_attachments_add</text>

          <!-- Temp folder (store) -->
          <rect x="200" y="264" width="160" height="64" rx="6" fill="#ffffff" stroke="#d3d3d3" stroke-width="1"/>
          <text x="280" y="294">Pasta temporária</text>
          <text x="280" y="310" font-family="monospace" font-size="9" font-weight="400" fill="#555555">taiga-mcp-XXXXXX</text>

          <!-- taiga-mcp server (focal) -->
          <rect x="464" y="72" width="144" height="256" rx="6" fill="#dff5ec" stroke="#006557" stroke-width="1.5"/>
          <text x="536" y="198" fill="#0b302c">servidor taiga-mcp</text>
          <text x="536" y="214" font-family="monospace" font-size="9" font-weight="400" fill="#0b302c">node dist/index.js</text>

          <!-- Taiga REST API -->
          <rect x="744" y="72" width="160" height="64" rx="6" fill="#ffffff" stroke="#212121" stroke-width="1"/>
          <text x="824" y="102">API REST do Taiga</text>
          <text x="824" y="118" font-family="monospace" font-size="9" font-weight="400" fill="#555555">/api/v1</text>

          <!-- Attachment file server -->
          <rect x="744" y="264" width="160" height="64" rx="6" fill="#ffffff" stroke="#212121" stroke-width="1"/>
          <text x="824" y="292">Servidor de</text>
          <text x="824" y="308">arquivos de anexo</text>
        </g>

        <!-- Legend strip -->
        <line x1="40" y1="376" x2="920" y2="376" stroke="#000000" stroke-opacity="0.12" stroke-width="1"/>
        <text x="40" y="404" fill="#555555" font-size="8" font-family="monospace" letter-spacing="0.18em">LEGENDA</text>
        <rect x="112" y="394" width="24" height="12" rx="2" fill="#dff5ec" stroke="#006557" stroke-width="1.2"/>
        <rect x="244" y="394" width="24" height="12" rx="2" fill="#ffffff" stroke="#212121" stroke-width="1"/>
        <rect x="392" y="394" width="24" height="12" rx="2" fill="#ffffff" stroke="#d3d3d3" stroke-width="1"/>
        <line x1="500" y1="400" x2="528" y2="400" stroke="#b85c33" stroke-width="1.2" marker-end="url(#d-01-architecture-pt-arrow-link)"/>
        <line x1="616" y1="400" x2="644" y2="400" stroke="#414147" stroke-width="1.2" marker-end="url(#d-01-architecture-pt-arrow)"/>
        <line x1="728" y1="400" x2="756" y2="400" stroke="#414147" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#d-01-architecture-pt-arrow)"/>
        <g font-family="sans-serif" font-size="9" fill="#414147">
          <text x="144" y="404">Este servidor</text>
          <text x="276" y="404">Pessoa ou programa</text>
          <text x="424" y="404">Disco local</text>
          <text x="536" y="404">HTTPS</text>
          <text x="652" y="404">E/S local</text>
          <text x="764" y="404">Só uma tool</text>
        </g>
      </svg>
