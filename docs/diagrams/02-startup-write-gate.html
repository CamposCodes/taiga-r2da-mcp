<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>taiga-mcp start sequence</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Ubuntu:wght@400;500;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #e6f6f4;
      --color-ink:     #212121;
      --color-muted:   #414147;
      --color-accent:  #006557;
      --font-sans:     'Ubuntu', 'Segoe UI', sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, Consolas, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width).
       This wrapper lets a narrow screen scroll the diagram, not the page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    /* Must come after the svg rule: paper has no scrollbar. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · taiga-mcp</p>
    <h1>Start sequence and the write gate</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 896" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d-02-startup-write-gate-title d-02-startup-write-gate-desc">
        <title id="d-02-startup-write-gate-title">Start sequence and the TAIGA_WRITE gate</title>
        <desc id="d-02-startup-write-gate-desc">Flowchart of the server start: it exits with code 1 when TAIGA_URL or TAIGA_TOKEN is missing or unsafe, or when Taiga refuses the token on GET /users/me, registers the 10 read tools, registers the 7 write tools only when TAIGA_WRITE is 1, and with them the tool that deletes only when TAIGA_DELETE is 1 too, then connects the stdio transport and is ready.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#414147"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#006557"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#e6f6f4"/>

        <!-- Zones (behind arrows and nodes) -->
        <rect x="40" y="40" width="880" height="384" rx="8" fill="#f5f5f5" stroke="#d3d3d3" stroke-width="1"/>
        <rect x="40" y="440" width="880" height="200" rx="8" fill="#f5f5f5" stroke="#d3d3d3" stroke-width="1"/>
        <rect x="40" y="656" width="880" height="168" rx="8" fill="#f5f5f5" stroke="#d3d3d3" stroke-width="1"/>
        <g font-family="'Geist Mono', ui-monospace, Consolas, monospace" font-size="8" fill="#555555" letter-spacing="0.14em">
          <text x="56" y="57">STARTUP CHECKS</text>
          <text x="56" y="457">TOOL REGISTRATION</text>
          <text x="56" y="673">TRANSPORT</text>
        </g>

        <!-- Arrows first (behind nodes) -->
        <g stroke="#414147" stroke-width="1.2" fill="none">
          <!-- start to environment check -->
          <line x1="320" y1="112" x2="320" y2="136" marker-end="url(#arrow)"/>
          <!-- environment check: no, exit -->
          <line x1="440" y1="176" x2="560" y2="176" marker-end="url(#arrow)"/>
          <!-- environment check: yes -->
          <line x1="320" y1="216" x2="320" y2="248" marker-end="url(#arrow)"/>
          <!-- GET /users/me to token check -->
          <line x1="320" y1="296" x2="320" y2="320" marker-end="url(#arrow)"/>
          <!-- token check: no, exit -->
          <line x1="440" y1="360" x2="560" y2="360" marker-end="url(#arrow)"/>
          <!-- token check: yes -->
          <line x1="320" y1="400" x2="320" y2="464" marker-end="url(#arrow)"/>
          <!-- read tools to write gate -->
          <line x1="320" y1="512" x2="320" y2="536" marker-end="url(#arrow)"/>
          <!-- write gate: no -->
          <line x1="320" y1="616" x2="320" y2="680" marker-end="url(#arrow)"/>
          <!-- write tools rejoin at the transport step -->
          <path d="M 680,600 V 696 Q 680,704 672,704 H 440" marker-end="url(#arrow)"/>
          <!-- transport to ready -->
          <line x1="320" y1="728" x2="320" y2="752" marker-end="url(#arrow)"/>
        </g>
        <!-- write gate: yes (accent, the gated path) -->
        <line x1="440" y1="576" x2="560" y2="576" stroke="#006557" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- Arrow labels: 8px clear of the line, above horizontals and beside verticals -->
        <rect x="488" y="156" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <rect x="328" y="228" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <rect x="488" y="340" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <rect x="328" y="404" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <rect x="484" y="556" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <rect x="328" y="620" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <g font-family="'Geist Mono', ui-monospace, Consolas, monospace" font-size="8" fill="#414147" text-anchor="middle" letter-spacing="0.08em">
          <text x="500" y="165">NO</text>
          <text x="342" y="237">YES</text>
          <text x="500" y="349">NO</text>
          <text x="342" y="413">YES</text>
          <text x="500" y="565" fill="#006557">YES</text>
          <text x="340" y="629">NO</text>
        </g>

        <!-- Nodes: shape carries type -->
        <g font-family="'Ubuntu', 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#212121" text-anchor="middle">
          <!-- Start (oval) -->
          <rect x="220" y="64" width="200" height="48" rx="24" fill="#ffffff" stroke="#555555" stroke-width="1"/>
          <text x="320" y="85">Client starts</text>
          <text x="320" y="100" font-family="'Geist Mono', ui-monospace, Consolas, monospace" font-size="9" font-weight="400" fill="#555555">node dist/index.js</text>

          <!-- Decision: environment -->
          <polygon points="320,136 440,176 320,216 200,176" fill="#ffffff" stroke="#212121" stroke-width="1"/>
          <text x="320" y="173"><tspan font-family="'Geist Mono', ui-monospace, Consolas, monospace" font-size="11">TAIGA_URL</tspan> and</text>
          <text x="320" y="188"><tspan font-family="'Geist Mono', ui-monospace, Consolas, monospace" font-size="11">TAIGA_TOKEN</tspan> set?</text>

          <!-- Exit (oval): missing variable -->
          <rect x="560" y="152" width="240" height="48" rx="24" fill="#ffffff" stroke="#555555" stroke-width="1"/>
          <text x="680" y="173">Exit 1</text>
          <text x="680" y="188" font-family="'Geist Mono', ui-monospace, Consolas, monospace" font-size="9" font-weight="400" fill="#555555">Variable missing or unsafe</text>

          <!-- Step: GET /users/me -->
          <rect x="200" y="248" width="240" height="48" rx="6" fill="#ffffff" stroke="#212121" stroke-width="1"/>
          <text x="320" y="276" font-family="'Geist Mono', ui-monospace, Consolas, monospace">GET /users/me</text>

          <!-- Decision: token -->
          <polygon points="320,320 440,360 320,400 200,360" fill="#ffffff" stroke="#212121" stroke-width="1"/>
          <text x="320" y="364">Token accepted?</text>

          <!-- Exit (oval): token refused -->
          <rect x="560" y="336" width="240" height="48" rx="24" fill="#ffffff" stroke="#555555" stroke-width="1"/>
          <text x="680" y="357">Exit 1</text>
          <text x="680" y="372" font-family="'Geist Mono', ui-monospace, Consolas, monospace" font-size="9" font-weight="400" fill="#555555">Taiga refused the token</text>

          <!-- Step: read tools -->
          <rect x="200" y="464" width="240" height="48" rx="6" fill="#ffffff" stroke="#212121" stroke-width="1"/>
          <text x="320" y="492">Register the 10 read tools</text>

          <!-- Decision: write gate (focal) -->
          <polygon points="320,536 440,576 320,616 200,576" fill="#dff5ec" stroke="#006557" stroke-width="1.5"/>
          <text x="320" y="580" fill="#0b302c"><tspan font-family="'Geist Mono', ui-monospace, Consolas, monospace" font-size="11">TAIGA_WRITE</tspan> on?</text>

          <!-- Step: write tools (runs only past the gate, dashed) -->
          <rect x="560" y="552" width="240" height="48" rx="6" fill="#ffffff" stroke="#212121" stroke-width="1" stroke-dasharray="4,3"/>
          <text x="680" y="574">Register the 7 write tools</text>
          <text x="680" y="590" font-family="'Geist Mono', ui-monospace, Consolas, monospace" font-size="9" font-weight="400" fill="#555555">+1 that deletes, with TAIGA_DELETE=1</text>

          <!-- Step: transport -->
          <rect x="200" y="680" width="240" height="48" rx="6" fill="#ffffff" stroke="#212121" stroke-width="1"/>
          <text x="320" y="708">Connect the stdio transport</text>

          <!-- Ready (oval) -->
          <rect x="220" y="752" width="200" height="48" rx="24" fill="#ffffff" stroke="#555555" stroke-width="1"/>
          <text x="320" y="773">Ready</text>
          <text x="320" y="788" font-family="'Geist Mono', ui-monospace, Consolas, monospace" font-size="9" font-weight="400" fill="#555555">one status line on stderr</text>
        </g>

        <!-- Legend strip -->
        <line x1="40" y1="848" x2="920" y2="848" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
        <text x="40" y="876" fill="#555555" font-size="8" font-family="'Geist Mono', ui-monospace, Consolas, monospace" letter-spacing="0.18em">LEGEND</text>
        <rect x="112" y="866" width="24" height="12" rx="6" fill="#ffffff" stroke="#555555" stroke-width="1"/>
        <rect x="236" y="866" width="24" height="12" rx="2" fill="#ffffff" stroke="#212121" stroke-width="1"/>
        <polygon points="320,872 332,866 344,872 332,878" fill="#ffffff" stroke="#212121" stroke-width="1"/>
        <polygon points="428,872 440,866 452,872 440,878" fill="#dff5ec" stroke="#006557" stroke-width="1.2"/>
        <rect x="544" y="866" width="24" height="12" rx="2" fill="#ffffff" stroke="#212121" stroke-width="1" stroke-dasharray="4,3"/>
        <g font-family="'Ubuntu', 'Segoe UI', sans-serif" font-size="9" fill="#414147">
          <text x="144" y="876">Start or end</text>
          <text x="268" y="876">Step</text>
          <text x="352" y="876">Decision</text>
          <text x="460" y="876">Write gate</text>
          <text x="576" y="876">Runs only past the gate</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
