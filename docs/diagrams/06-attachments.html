<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reading and sending an attachment</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Ubuntu:wght@400;500;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #e6f6f4;
      --color-ink:     #212121;
      --color-muted:   #414147;
      --color-accent:  #006557;
      --font-sans:     'Ubuntu', 'Segoe UI', sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, Consolas, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width).
       This wrapper lets a narrow screen scroll the diagram, not the page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    /* Must come after the svg rule: paper has no scrollbar. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · taiga-mcp</p>
    <h1>Reading and sending an attachment</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 728" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d-06-attachments-title d-06-attachments-desc">
        <title id="d-06-attachments-title">Reading and sending an attachment</title>
        <desc id="d-06-attachments-desc">Flowchart of the two attachment tools: taiga_attachments_get refuses a file larger than 25 MB, otherwise downloads it without the token and returns it as image content, as text content or as a file saved to the temp folder, depending on the kind of file; taiga_attachments_add, which exists only with TAIGA_WRITE=1, checks for a file up to 25 MB that does not look like a credential and then sends it as a form to the attachments of the user story, task or issue.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#414147"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#e6f6f4"/>

        <!-- Zones (behind connectors and nodes) -->
        <rect x="40" y="40" width="504" height="608" rx="8" fill="#f5f5f5" stroke="#d3d3d3" stroke-width="1"/>
        <text x="56" y="57" fill="#555555" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, Consolas, monospace" letter-spacing="0.14em">READING AN ATTACHMENT</text>
        <rect x="568" y="40" width="352" height="452" rx="8" fill="#f5f5f5" stroke="#d3d3d3" stroke-width="1"/>
        <text x="584" y="57" fill="#555555" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, Consolas, monospace" letter-spacing="0.14em">SENDING AN ATTACHMENT</text>

        <!-- Connectors first, so they sit behind the nodes -->
        <!-- get-big -->
        <path d="M292,128 V168" fill="none" stroke="#414147" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- big-refuse -->
        <path d="M388,216 H428" fill="none" stroke="#414147" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- big-download -->
        <path d="M292,264 V304" fill="none" stroke="#414147" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- download-kind -->
        <path d="M292,376 V408" fill="none" stroke="#414147" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- kind-image -->
        <path d="M196,456 H132 Q124,456 124,464 V560" fill="none" stroke="#414147" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- kind-text -->
        <path d="M292,504 V560" fill="none" stroke="#414147" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- kind-file -->
        <path d="M388,456 H452 Q460,456 460,464 V560" fill="none" stroke="#414147" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- add-check -->
        <path d="M676,128 V156" fill="none" stroke="#414147" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- check-reject -->
        <path d="M764,216 H804" fill="none" stroke="#414147" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- check-upload -->
        <path d="M676,276 V308" fill="none" stroke="#414147" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- upload-done -->
        <path d="M676,372 V404" fill="none" stroke="#414147" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Connector labels, each on an opaque mask clear of its line -->
        <rect x="396" y="196" width="24" height="12" rx="2" fill="#f5f5f5"/><text x="408" y="205" fill="#414147" font-size="8" font-family="'Geist Mono', ui-monospace, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
        <rect x="264" y="278" width="20" height="12" rx="2" fill="#f5f5f5"/><text x="274" y="287" fill="#414147" font-size="8" font-family="'Geist Mono', ui-monospace, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
        <rect x="80" y="528" width="36" height="12" rx="2" fill="#f5f5f5"/><text x="98" y="537" fill="#414147" font-size="8" font-family="'Geist Mono', ui-monospace, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">IMAGE</text>
        <rect x="200" y="528" width="84" height="12" rx="2" fill="#f5f5f5"/><text x="242" y="537" fill="#414147" font-size="8" font-family="'Geist Mono', ui-monospace, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">TEXT EXTENSION</text>
        <rect x="372" y="528" width="80" height="12" rx="2" fill="#f5f5f5"/><text x="412" y="537" fill="#414147" font-size="8" font-family="'Geist Mono', ui-monospace, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">ANYTHING ELSE</text>
        <rect x="774" y="196" width="20" height="12" rx="2" fill="#f5f5f5"/><text x="784" y="205" fill="#414147" font-size="8" font-family="'Geist Mono', ui-monospace, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
        <rect x="644" y="286" width="24" height="12" rx="2" fill="#f5f5f5"/><text x="656" y="295" fill="#414147" font-size="8" font-family="'Geist Mono', ui-monospace, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>

        <!-- Nodes -->
        <!-- taiga_attachments_get -->
        <rect x="196" y="80" width="192" height="48" rx="24" fill="#ffffff" stroke="#555555" stroke-width="1"/>
        <text x="292" y="108" fill="#212121" font-size="12" font-weight="500" font-family="'Geist Mono', ui-monospace, Consolas, monospace" text-anchor="middle">taiga_attachments_get</text>
        <!-- Larger than 25 MB? -->
        <polygon points="292,168 388,216 292,264 196,216" fill="#ffffff" stroke="#212121" stroke-width="1"/>
        <text x="292" y="220" fill="#212121" font-size="12" font-weight="500" font-family="'Ubuntu', 'Segoe UI', sans-serif" text-anchor="middle">Larger than 25 MB?</text>
        <!-- Tool error -->
        <rect x="428" y="188" width="104" height="56" rx="24" fill="#ffffff" stroke="#555555" stroke-width="1"/>
        <text x="480" y="212" fill="#212121" font-size="12" font-weight="500" font-family="'Ubuntu', 'Segoe UI', sans-serif" text-anchor="middle">Tool error</text>
        <text x="480" y="228" fill="#555555" font-size="9" font-family="'Geist Mono', ui-monospace, Consolas, monospace" text-anchor="middle">file too large</text>
        <!-- Download -->
        <rect x="196" y="304" width="192" height="72" rx="6" fill="#ffffff" stroke="#212121" stroke-width="1"/>
        <text x="292" y="330" fill="#212121" font-size="12" font-weight="500" font-family="'Ubuntu', 'Segoe UI', sans-serif" text-anchor="middle">Download</text>
        <text x="292" y="346" fill="#555555" font-size="9" font-family="'Geist Mono', ui-monospace, Consolas, monospace" text-anchor="middle">from the address Taiga lists</text>
        <text x="292" y="359" fill="#555555" font-size="9" font-family="'Geist Mono', ui-monospace, Consolas, monospace" text-anchor="middle">without the token</text>
        <!-- Kind of file? -->
        <polygon points="292,408 388,456 292,504 196,456" fill="#dff5ec" stroke="#006557" stroke-width="1.4"/>
        <text x="292" y="460" fill="#0b302c" font-size="12" font-weight="500" font-family="'Ubuntu', 'Segoe UI', sans-serif" text-anchor="middle">Kind of file?</text>
        <!-- Image content -->
        <rect x="52" y="560" width="144" height="72" rx="24" fill="#ffffff" stroke="#555555" stroke-width="1"/>
        <text x="124" y="586" fill="#212121" font-size="12" font-weight="500" font-family="'Ubuntu', 'Segoe UI', sans-serif" text-anchor="middle">Image content</text>
        <text x="124" y="602" fill="#555555" font-size="9" font-family="'Geist Mono', ui-monospace, Consolas, monospace" text-anchor="middle">png, jpg, gif or webp</text>
        <text x="124" y="615" fill="#555555" font-size="9" font-family="'Geist Mono', ui-monospace, Consolas, monospace" text-anchor="middle">up to 3.5 MB</text>
        <!-- Text content -->
        <rect x="220" y="560" width="144" height="72" rx="24" fill="#ffffff" stroke="#555555" stroke-width="1"/>
        <text x="292" y="586" fill="#212121" font-size="12" font-weight="500" font-family="'Ubuntu', 'Segoe UI', sans-serif" text-anchor="middle">Text content</text>
        <text x="292" y="602" fill="#555555" font-size="9" font-family="'Geist Mono', ui-monospace, Consolas, monospace" text-anchor="middle">first 50,000 characters</text>
        <text x="292" y="615" fill="#555555" font-size="9" font-family="'Geist Mono', ui-monospace, Consolas, monospace" text-anchor="middle">UTF-8 or Latin-1</text>
        <!-- Saved file -->
        <rect x="388" y="560" width="144" height="72" rx="24" fill="#ffffff" stroke="#555555" stroke-width="1"/>
        <text x="460" y="586" fill="#212121" font-size="12" font-weight="500" font-family="'Ubuntu', 'Segoe UI', sans-serif" text-anchor="middle">Saved file</text>
        <text x="460" y="602" fill="#555555" font-size="9" font-family="'Geist Mono', ui-monospace, Consolas, monospace" text-anchor="middle">in the temp folder</text>
        <text x="460" y="615" fill="#555555" font-size="9" font-family="'Geist Mono', ui-monospace, Consolas, monospace" text-anchor="middle">answer has the path</text>
        <!-- taiga_attachments_add -->
        <rect x="580" y="80" width="192" height="48" rx="24" fill="#ffffff" stroke="#555555" stroke-width="1"/>
        <text x="676" y="100" fill="#212121" font-size="12" font-weight="500" font-family="'Geist Mono', ui-monospace, Consolas, monospace" text-anchor="middle">taiga_attachments_add</text>
        <text x="676" y="116" fill="#555555" font-size="9" font-family="'Geist Mono', ui-monospace, Consolas, monospace" text-anchor="middle">only with TAIGA_WRITE=1</text>
        <!-- A file up to 25 MB that is not a secret? -->
        <polygon points="676,156 764,216 676,276 588,216" fill="#ffffff" stroke="#212121" stroke-width="1"/>
        <text x="676" y="204" fill="#212121" font-size="12" font-weight="500" font-family="'Ubuntu', 'Segoe UI', sans-serif" text-anchor="middle">A file</text>
        <text x="676" y="220" fill="#212121" font-size="12" font-weight="500" font-family="'Ubuntu', 'Segoe UI', sans-serif" text-anchor="middle">up to 25 MB,</text>
        <text x="676" y="236" fill="#212121" font-size="12" font-weight="500" font-family="'Ubuntu', 'Segoe UI', sans-serif" text-anchor="middle">not a secret?</text>
        <!-- Tool error -->
        <rect x="804" y="188" width="104" height="56" rx="24" fill="#ffffff" stroke="#555555" stroke-width="1"/>
        <text x="856" y="212" fill="#212121" font-size="12" font-weight="500" font-family="'Ubuntu', 'Segoe UI', sans-serif" text-anchor="middle">Tool error</text>
        <text x="856" y="228" fill="#555555" font-size="9" font-family="'Geist Mono', ui-monospace, Consolas, monospace" text-anchor="middle">nothing is sent</text>
        <!-- Sent as a form -->
        <rect x="588" y="308" width="176" height="64" rx="6" fill="#ffffff" stroke="#212121" stroke-width="1"/>
        <text x="676" y="336" fill="#212121" font-size="12" font-weight="500" font-family="'Ubuntu', 'Segoe UI', sans-serif" text-anchor="middle">Sent as a form</text>
        <text x="676" y="352" fill="#555555" font-size="9" font-family="'Geist Mono', ui-monospace, Consolas, monospace" text-anchor="middle">POST …/attachments</text>
        <!-- Answer -->
        <rect x="588" y="404" width="176" height="72" rx="24" fill="#ffffff" stroke="#555555" stroke-width="1"/>
        <text x="676" y="430" fill="#212121" font-size="12" font-weight="500" font-family="'Ubuntu', 'Segoe UI', sans-serif" text-anchor="middle">Answer</text>
        <text x="676" y="446" fill="#555555" font-size="9" font-family="'Geist Mono', ui-monospace, Consolas, monospace" text-anchor="middle">id, name, size and</text>
        <text x="676" y="459" fill="#555555" font-size="9" font-family="'Geist Mono', ui-monospace, Consolas, monospace" text-anchor="middle">address in Taiga</text>

        <!-- Legend: bottom strip -->
        <line x1="40" y1="672" x2="920" y2="672" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
        <text x="40" y="700" fill="#555555" font-size="8" font-family="'Geist Mono', ui-monospace, Consolas, monospace" letter-spacing="0.18em">LEGEND</text>
        <rect x="112" y="690" width="24" height="12" rx="6" fill="#ffffff" stroke="#555555" stroke-width="1"/>
        <text x="144" y="700" fill="#414147" font-size="9" font-family="'Ubuntu', 'Segoe UI', sans-serif">Start or result</text>
        <rect x="248" y="690" width="24" height="12" rx="2" fill="#ffffff" stroke="#212121" stroke-width="1"/>
        <text x="280" y="700" fill="#414147" font-size="9" font-family="'Ubuntu', 'Segoe UI', sans-serif">Step</text>
        <polygon points="328,696 340,690 352,696 340,702" fill="#ffffff" stroke="#212121" stroke-width="1"/>
        <text x="360" y="700" fill="#414147" font-size="9" font-family="'Ubuntu', 'Segoe UI', sans-serif">Decision</text>
        <polygon points="428,696 440,690 452,696 440,702" fill="#dff5ec" stroke="#006557" stroke-width="1.4"/>
        <text x="460" y="700" fill="#414147" font-size="9" font-family="'Ubuntu', 'Segoe UI', sans-serif">Decides the form of the answer</text>
      </svg>
    </div>
  </div>
</body>
</html>
