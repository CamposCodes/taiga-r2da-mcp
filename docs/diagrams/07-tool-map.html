<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>taiga-mcp tool map</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Ubuntu:wght@400;500;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #e6f6f4;
      --color-ink:     #212121;
      --color-muted:   #414147;
      --color-accent:  #006557;
      --font-sans:     'Ubuntu', 'Segoe UI', sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, Consolas, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width).
       This wrapper lets a narrow screen scroll the diagram, not the page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    /* Must come after the svg rule: paper has no scrollbar. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Nested · taiga-mcp</p>
    <h1>One server, fourteen tools, two groups</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d-07-tool-map-title d-07-tool-map-desc">
        <title id="d-07-tool-map-title">taiga-mcp tool map</title>
        <desc id="d-07-tool-map-desc">Containment diagram: the taiga-mcp server holds 10 read tools that are always registered, 7 write tools that are registered only with TAIGA_WRITE=1 and one tool that deletes, registered only with TAIGA_WRITE=1 and TAIGA_DELETE=1, each listed by name.</desc>

        <rect width="100%" height="100%" fill="#e6f6f4"/>

        <!-- Level 1: the server -->
        <rect x="40" y="40" width="880" height="440" rx="8" fill="#f5f5f5" stroke="#414147" stroke-width="1"/>
        <text x="64" y="65" fill="#555555" font-size="8" font-family="'Geist Mono', ui-monospace, Consolas, monospace" letter-spacing="0.14em">SERVER</text>
        <text x="64" y="84" fill="#212121" font-size="14" font-weight="500" font-family="'Ubuntu', 'Segoe UI', sans-serif">taiga-mcp</text>

        <!-- Level 2: read tools, always registered -->
        <rect x="64" y="100" width="512" height="232" rx="8" fill="#ffffff" stroke="#212121" stroke-width="1"/>
        <text x="88" y="130" fill="#212121" font-size="14" font-weight="500" font-family="'Ubuntu', 'Segoe UI', sans-serif">Read tools</text>
        <text x="88" y="146" fill="#555555" font-size="9" font-family="'Geist Mono', ui-monospace, Consolas, monospace">always registered</text>
        <rect x="496" y="116" width="56" height="16" rx="2" fill="none" stroke="#d3d3d3" stroke-width="1"/>
        <text x="524" y="127" fill="#414147" font-size="8" font-family="'Geist Mono', ui-monospace, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">10 TOOLS</text>
        <line x1="88" y1="164" x2="552" y2="164" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
        <line x1="320" y1="176" x2="320" y2="312" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
        <!-- Level 3: tool names, source order, down the first column then the second -->
        <g font-family="'Geist Mono', ui-monospace, Consolas, monospace" font-size="12" font-weight="500" fill="#212121">
          <text x="88" y="192">taiga_me</text>
          <text x="88" y="220">taiga_projects_list</text>
          <text x="88" y="248">taiga_projects_get</text>
          <text x="88" y="276">taiga_sprints_list</text>
          <text x="88" y="304">taiga_userstories_list</text>
          <text x="344" y="192">taiga_tasks_list</text>
          <text x="344" y="220">taiga_issues_list</text>
          <text x="344" y="248">taiga_items_get</text>
          <text x="344" y="276">taiga_search</text>
          <text x="344" y="304">taiga_attachments_get</text>
        </g>

        <!-- Level 2: write tools, gated (focal, dashed border) -->
        <rect x="608" y="100" width="288" height="356" rx="8" fill="#dff5ec" stroke="#006557" stroke-width="1.5" stroke-dasharray="6,4"/>
        <text x="632" y="130" fill="#0b302c" font-size="14" font-weight="500" font-family="'Ubuntu', 'Segoe UI', sans-serif">Write tools</text>
        <text x="632" y="146" fill="#0b302c" font-size="9" font-family="'Geist Mono', ui-monospace, Consolas, monospace">only with TAIGA_WRITE=1</text>
        <rect x="816" y="116" width="56" height="16" rx="2" fill="none" stroke="#006557" stroke-opacity="0.5" stroke-width="1"/>
        <text x="844" y="127" fill="#006557" font-size="8" font-family="'Geist Mono', ui-monospace, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">7 TOOLS</text>
        <line x1="632" y1="164" x2="872" y2="164" stroke="#006557" stroke-opacity="0.3" stroke-width="1"/>
        <g font-family="'Geist Mono', ui-monospace, Consolas, monospace" font-size="12" font-weight="500" fill="#0b302c">
          <text x="632" y="192">taiga_userstories_create</text>
          <text x="632" y="220">taiga_userstories_update</text>
          <text x="632" y="248">taiga_tasks_create</text>
          <text x="632" y="276">taiga_tasks_update</text>
          <text x="632" y="304">taiga_issues_create</text>
          <text x="632" y="332">taiga_issues_update</text>
          <text x="632" y="360">taiga_attachments_add</text>
        </g>

        <!-- Level 2: the tool that deletes, behind a second gate (dashed border) -->
        <rect x="64" y="356" width="512" height="100" rx="8" fill="#ffffff" stroke="#212121" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="88" y="386" fill="#212121" font-size="14" font-weight="500" font-family="'Ubuntu', 'Segoe UI', sans-serif">Delete tool</text>
        <text x="88" y="402" fill="#555555" font-size="9" font-family="'Geist Mono', ui-monospace, Consolas, monospace">only with TAIGA_WRITE=1 and TAIGA_DELETE=1</text>
        <rect x="496" y="372" width="56" height="16" rx="2" fill="none" stroke="#d3d3d3" stroke-width="1"/>
        <text x="524" y="383" fill="#414147" font-size="8" font-family="'Geist Mono', ui-monospace, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">1 TOOL</text>
        <line x1="88" y1="416" x2="552" y2="416" stroke="#000000" stroke-opacity="0.12" stroke-width="1"/>
        <text x="88" y="440" fill="#212121" font-size="12" font-weight="500" font-family="'Geist Mono', ui-monospace, Consolas, monospace">taiga_items_delete</text>
        <text x="344" y="440" fill="#555555" font-size="9" font-family="'Geist Mono', ui-monospace, Consolas, monospace">two calls: show, then delete</text>
      </svg>
    </div>
  </div>
</body>
</html>
